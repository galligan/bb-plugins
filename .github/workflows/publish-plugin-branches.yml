name: Publish plugin branches

on:
  push:
    branches:
      - main
    paths:
      - "plugins/linear/**"
      - ".github/workflows/publish-plugin-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Keep the legacy Linear install branch current
        shell: bash
        run: |
          set -euo pipefail
          git subtree split --prefix=plugins/linear --branch=linear
          git push origin linear:refs/heads/linear
