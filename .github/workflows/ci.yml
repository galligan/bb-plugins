name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The Graphite gates use node:sqlite; native addon build scripts are not needed.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - run: bun run build
